<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Firebase Basics</title>
  <link rel="icon" type="image/x-icon" href="assets/images/dtec_favicon.png">

  <link href="style.css" rel="stylesheet" type="text/css" />

  <!-- firebase start ****************************************-->
  <!-- Firebase App (core Firebase SDK) is always required & must be listed 1st -->
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-app.js"></script>
  <!-- Add Firebase products that you want to use -->
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-analytics.js"></script>
  <!-- firebase end ******************************************-->
  <script src="./scripts/firebase/fb_setup.js"></script>
  <script src="./scripts/firebase/fb_io.js"></script>

</head>

<body>
  <h1>Please try and break it!</h1>
  <button onclick="fb_write('messages/message-1', '', 'kia ora')">Message: 'kia ora'</button>
  <button onclick="fb_write('messages/message-1', '', 'ka kite ano')">Message: 'ka kite ano'</button>
  <br>
  <button id="i_add_listener" onclick="
    fb_addWriteListener('messages/message-1', cb_updateDatabaseText); 
    var self = document.getElementById('i_add_listener');
    self.disabled = true; //Disable the button

    var singleRead = document.getElementById('i_single_read');
    singleRead.disabled = true; //Disable the button
    ">Add Listener</button> 
  OR
  <button id="i_single_read" onclick="fb_read('messages/message-1', cb_updateDatabaseText);">Update Message Output</button>
  <br>
  <button onclick="
    addHighScore('Jeff', 1000); 
    addHighScore('Jeremy', 2000); 
    addHighScore('Joseph', 3000);
  ">Reset Default High Scores</button>
  <br>

  <p>Input username and high score:</p>
  <input type="text" id="i_username">
  <input type="number" id="i_hiscore">

  <button onclick="addHighScoreFromDocument();">Add High Score</button>
  <button onclick="displayHighScoreFromDocument();">Display High Score</button>

  <br>
  <p>Sort high scores:</p>
  <form>
    <input onchange="displayHighScoreTable()" type="radio" id="i_sort_name" name="sort" value="name" checked>
    <label for="i_sort_name">- by name</label><br>
    <input onchange="displayHighScoreTable()" type="radio" id="i_sort_score" name="sort" value="score">
    <label for="i_sort_score">- by score</label><br>
  </form>
  
  <br>
  <button id="i_display_hiscore_table" onclick="displayHighScoreTable();">Display All High Scores</button>
  OR
  <button id="i_add_hiscore_listener" onclick="
    fb_addWriteListener('high-scores/', displayHighScoreTable);
    var self = document.getElementById('i_add_hiscore_listener');
    self.disabled = true; //Disable the button

    var displayTableButton = document.getElementById('i_display_hiscore_table');
    displayTableButton.disabled = true; //Disable the button
  ">Add listener</button>


  <h2>Output</h2>
  <p>From messages:</p>
  <div class="databaseOutput" id="databaseOutput"></div>
  <br>

  <p>High score outputs:</p>
  <div class="databaseOutput" id="o_single_hiscore"></div>
  <br>
  <div class="databaseOutput" id="o_hiscore_table"></div>

  <script src="./scripts/core/main.js"></script>

</body>

</html>
